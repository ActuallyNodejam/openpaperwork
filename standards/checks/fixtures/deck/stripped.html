<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Empty</title><style>
:root{--font:"Helvetica Neue",Helvetica,Arial,sans-serif;
 --ground:#0B0D10;--paper:#FFFFFF;--ink:#12100E;--ink-2:#4A443E;--ink-3:#9A9views;
 --line:#E3DCD3;--accent:#D9480F;
 --m-x:106px;--gutter:24px;--col:120.33px;--head-h:200px;--body-h:768px;--foot-h:112px;
 --label:19px;--title:44px;--sub:26px;--body:22px;--small:19px;--figure:76px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;padding:0;background:var(--paper);font-family:var(--font);color:var(--ink)}
.slide{position:relative;width:1920px;height:1080px;display:grid;
 grid-template-columns:repeat(12,var(--col));
 grid-template-rows:var(--head-h) var(--body-h) var(--foot-h);
 column-gap:var(--gutter);padding:0 var(--m-x);justify-content:start;page-break-after:always;
 border-bottom:1px solid var(--line)}
.head{grid-column:1 / span 12;grid-row:1;display:flex;flex-direction:column;justify-content:flex-end;
 padding-bottom:20px;gap:10px}
.head .label{font-size:var(--label);letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
.head h1{font-size:var(--title);line-height:1.12;max-width:1500px}
.head .rule{height:2px;background:var(--accent);width:100%}
.head .logo{margin-left:auto;font-size:var(--label);letter-spacing:1px;color:var(--ink-2)}
.body{grid-column:1 / span 12;grid-row:2;display:grid;grid-template-columns:repeat(12,var(--col));
 column-gap:var(--gutter);align-content:stretch;height:100%}
.foot{grid-column:1 / span 12;grid-row:3;border-top:1px solid var(--line);display:flex;
 justify-content:space-between;align-items:center;font-size:var(--small);color:var(--ink-2)}
.box{display:flex;flex-direction:column;justify-content:center;gap:18px;height:100%}
.box.text{grid-column:1 / span 4}
.box.visual{grid-column:5 / span 8}
.box.full{grid-column:1 / span 12}
.box.lower{grid-column:1 / span 8;justify-content:flex-end;padding-bottom:40px}
.box{grid-column:1 / span 12}
.big{font-size:64px;line-height:1.08;letter-spacing:-.5px}
.sub{font-size:var(--sub);color:var(--ink-2);max-width:1100px}
.contents{display:flex;gap:36px;font-size:var(--small);color:var(--ink-2);margin-top:18px}
.contents b{color:var(--accent);margin-right:8px}
.stat .n{font-size:var(--figure);line-height:1;font-variant-numeric:tabular-nums}
.stat .cap{font-size:var(--label);letter-spacing:1px;text-transform:uppercase;color:var(--ink-2)}
.stat .note{font-size:var(--body);line-height:1.4;color:var(--ink-2)}
ul.bullets{list-style:none;display:flex;flex-direction:column;gap:16px}
ul.bullets li{font-size:var(--body);line-height:1.45;color:var(--ink-2);padding-left:20px;position:relative}
ul.bullets li:before{content:"";position:absolute;left:0;top:12px;width:8px;height:8px;
 background:var(--accent)}
table{width:100%;border-collapse:collapse}
th{font-size:var(--label);letter-spacing:1px;text-transform:uppercase;color:var(--ink-2);
 text-align:left;border-bottom:1px solid var(--line);padding:14px 10px}
td{font-size:var(--body);border-bottom:1px solid var(--line);padding:18px 10px}
.n{text-align:right;font-variant-numeric:tabular-nums}
.steps{display:grid;grid-template-columns:repeat(9,1fr);align-items:center;height:100%}
.step{border-top:2px solid var(--accent);padding-top:18px}
.step .when{font-size:var(--label);letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.step .what{font-size:var(--body);color:var(--ink-2);margin-top:8px}
svg{width:100%;height:100%}
</style></head><body>
<section class="slide cover"><div class="head"><div class="label">Deck</div><div class="logo"></div></div><div class="body"><div class="box lower"><div class="big"></div><div class="sub"></div><div class="contents"></div></div></div><div class="foot"><div class="name">Empty</div><div class="page">01</div></div></section><section class="slide" data-type="numbers"><div class="head"><div class="label"></div><h1></h1><div class="rule"></div></div><div class="body"><div class="box text"></div><div class="box visual"></div></div><div class="foot"><div class="name">Empty</div><div class="page">02</div></div></section><section class="slide" data-type="chart-bullets"><div class="head"><div class="label"></div><h1></h1><div class="rule"></div></div><div class="body"><div class="box text"><ul class="bullets"></ul></div><div class="box visual"></div></div><div class="foot"><div class="name">Empty</div><div class="page">03</div></div></section><section class="slide" data-type="table"><div class="head"><div class="label"></div><h1></h1><div class="rule"></div></div><div class="body"><div class="box full"><table><thead><tr></tr></thead><tbody></tbody></table></div></div><div class="foot"><div class="name">Empty</div><div class="page">04</div></div></section><section class="slide" data-type="timeline"><div class="head"><div class="label"></div><h1></h1><div class="rule"></div></div><div class="body"><div class="box full"><div class="steps"></div></div></div><div class="foot"><div class="name">Empty</div><div class="page">05</div></div></section><section class="slide" data-type="closing"><div class="head"><div class="label"></div><h1></h1><div class="rule"></div></div><div class="body"><div class="box full"><div class="big"></div><div class="sub"></div></div></div><div class="foot"><div class="name">Empty</div><div class="page">06</div></div></section></body></html>
